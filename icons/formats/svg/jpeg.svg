<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 68 394 394" width="100%" height="100%">
  <style>
    @font-face {
      font-family: 'Quicksand';
      src: url('../../format-template/Quicksand/Quicksand-Bold.ttf');
    }
    .format-text {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
  <defs>
    <path id="body-path-k" d="M 220 80 C 300 80, 340 160, 340 220 C 340 260, 410 260, 380 320 C 350 380, 280 400, 220 400 C 140 400, 120 300, 120 220 C 120 140, 160 80, 220 80 Z" />
    <clipPath id="body-clip">
      <use href="#body-path-k" />
    </clipPath>
    <clipPath id="sign-inner-clip">
      <rect x="5" y="5" width="210" height="100" rx="10" />
    </clipPath>
    <pattern id="sign-grill" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#674032" stroke-width="7" />
    </pattern>
  </defs>
  <!-- Legs -->
  <path d="M 260 380 L 260 440 L 200 440" fill="none" stroke="#3B2508" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 190 390 L 190 450 L 130 450" fill="none" stroke="#3B2508" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Base Body -->
  <use href="#body-path-k" fill="#FDE4A9" />
  <g clip-path="url(#body-clip)">
    <path fill="none" stroke="#fef8ec" stroke-width="3.5" stroke-linecap="round" d="M 148.69 145.47 L 150.68 141.40 L 152.76 137.49 L 154.95 133.73 L 157.24 130.13 L 159.62 126.68 L 162.09 123.40 L 164.65 120.28 L 167.30 117.33 L 170.03 114.54 L 172.83 111.93 L 175.71 109.48 L 178.67 107.21 L 181.70 105.11 L 184.80 103.19 L 187.98 101.43 L 191.22 99.86 L 194.54 98.45 L 197.93 97.23 L 201.41 96.18 L 204.95 95.32 L 208.59 94.64 L 212.30 94.15 L 216.11 93.85 L 220.00 93.75" />
  </g>
  <!-- Outline -->
  <use href="#body-path-k" fill="none" stroke="#3B2508" stroke-width="24" stroke-linejoin="round" />
  <!-- Beak -->
  <path d="M 120 170 L 30 200 L 120 215 Z" fill="#3B2508" stroke="#3B2508" stroke-width="16" stroke-linejoin="round" />
  <!-- Eyes -->
  <g fill="none" stroke="#3B2508" stroke-width="18" stroke-linecap="round">
    <path d="M 125 165 Q 150 130 175 165" />
    <path d="M 175 160 Q 200 125 225 160" />
  </g>
  <!-- Blush -->
  <g stroke="#FF7799" stroke-width="16" stroke-linecap="round">
    <path d="M 110 200 L 125 180" />
    <path d="M 135 200 L 150 180" />
    <path d="M 200 190 L 215 170" />
    <path d="M 225 190 L 240 170" />
  </g>
  <!-- The Sign (Adjusted height and position) -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="220" height="110" rx="15" fill="#A99142" />
    <g clip-path="url(#sign-inner-clip)">
      <rect x="0" y="0" width="220" height="110" fill="url(#sign-grill)" />
    </g>
    <rect x="0" y="0" width="220" height="110" rx="15" fill="none" stroke="#4F5B33" stroke-width="10" />
    <text x="110" y="55" class="format-text" fill="#fff" font-size="58px">JPEG</text>
  </g>
  <!-- Tiny Stubby Hands Holding the Sign (Moved up with sign) -->
  <g fill="#FDE4A9" stroke="#3B2508" stroke-width="12">
    <ellipse cx="80" cy="260" rx="16" ry="12" />
    <ellipse cx="200" cy="260" rx="16" ry="12" />
  </g>
</svg>