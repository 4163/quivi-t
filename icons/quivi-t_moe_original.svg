<svg id="bird-kawaii" xmlns="http://www.w3.org/2000/svg" viewBox="10 50 430 430" width="100%" height="100%">
  <defs>
    <path id="body-path-k" d="M 220 80 C 300 80, 340 160, 340 220 C 340 260, 410 260, 380 320 C 350 380, 280 400, 220 400 C 140 400, 120 300, 120 220 C 120 140, 160 80, 220 80 Z" />
    <clipPath id="body-clip-k"><use href="#body-path-k" /></clipPath>
  </defs>

  <!-- Legs -->
  <path d="M 260 380 L 260 440 L 200 440" fill="none" stroke="#3B2508" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 190 390 L 190 450 L 130 450" fill="none" stroke="#3B2508" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Base Body -->
  <use href="#body-path-k" fill="#FDE4A9" />
  
  <!-- Shadow
  <g clip-path="url(#body-clip-k)">
    <path d="M 110 260 A 200 200 0 0 0 360 220 L 500 500 L 0 500 Z" fill="#E2BC74" />
  </g>
  -->

  <!-- Mascot Glossy Highlights (Subtly incorporating #fef8ec) -->
  <g fill="#fef8ec">
    <ellipse cx="170" cy="115" rx="25" ry="10" transform="rotate(-30 170 115)" />
    <ellipse cx="220" cy="100" rx="10" ry="6" transform="rotate(-15 220 100)" />
  </g>
  
  <!-- Outline -->
  <use href="#body-path-k" fill="none" stroke="#3B2508" stroke-width="24" stroke-linejoin="round" />
  
  <!-- Classic Pointy Beak -->
  <path d="M 120 170 L 30 200 L 120 215 Z" fill="#3B2508" stroke="#3B2508" stroke-width="16" stroke-linejoin="round" />
  
  <!-- Kawaii Eyes -->
  <g fill="#3B2508">
    <ellipse cx="150" cy="155" rx="14" ry="22" />
    <ellipse cx="200" cy="150" rx="12" ry="19" />
  </g>
  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <circle cx="153" cy="145" r="5" />
    <circle cx="145" cy="165" r="2.5" />
    <circle cx="202" cy="142" r="4.5" />
    <circle cx="196" cy="158" r="2" />
  </g>
  
  <!-- Blush -->
  <ellipse cx="130" cy="190" rx="16" ry="8" fill="#FF4477" opacity="0.4" transform="rotate(-15 130 190)" />
  <ellipse cx="215" cy="180" rx="14" ry="7" fill="#FF4477" opacity="0.4" transform="rotate(-15 215 180)" />
</svg>
