[package]
name = "tauri-app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
natord = "1.0.9"
tauri-plugin-dialog = "2.7.2"
zip = { version = "8.6.0", default-features = true }
unrar = "0.5.8"
sevenz-rust2 = "0.21"
tar = "0.4"
notify = "6"
tauri-plugin-single-instance = "2"
image = { version = "0.25", features = ["ico"] }
md5 = "0.8.1"
base64 = "0.23.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com"] }
winreg = "0.53.0"
encoding_rs = "0.8"

